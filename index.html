she performed penance for countless years to win Shiva. She blesses patience, study and the quiet resolve to keep going."},{"n":3,"name":"Chandraghanta","date":"14 October","tithi":"Tritiya","c":"#B91C1C","epithet":"Bearer of the Crescent Bell","text":"The crescent moon on her brow is shaped like a bell, and its sound scatters all fear. Riding a tiger with ten arms, she turns terror into courage."},{"n":4,"name":"Kushmanda","date":"15 October","tithi":"Chaturthi","c":"#0369A1","epithet":"She Who Smiled the Universe Awake","text":"With a single smile she brought the cosmos out of darkness, and she dwells within the sun itself. She is worshipped for light, health and vitality."},{"n":5,"name":"Skandamata","date":"16 October","tithi":"Panchami","c":"#C026D3","epithet":"Mother of Skanda","text":"Seated on a lotus with the infant Kartikeya in her lap, she is motherhood itself - fierce in protection, endless in tenderness."},{"n":6,"name":"Katyayani","date":"17 October","tithi":"Shashthi","c":"#CA8A04","epithet":"The Warrior Born of Fire","text":"Born from the gathered radiance of the gods in sage Katyayana's hermitage, she took up arms against Mahishasura. She is righteous courage that does not flinch."},{"n":7,"name":"Kalaratri","date":"18 October","tithi":"Saptami","c":"#4338CA","epithet":"The Darkest Night","text":"Her form is night itself, and it is the night that ends all fear. Fierce to look upon and utterly gentle to her devotees, she destroys ignorance and every negativity."},{"n":8,"name":"Mahagauri","date":"19 October","tithi":"Ashtami","c":"#0F766E","epithet":"The Radiant White One","text":"After long penance she emerged luminous as moonlight, riding a white bull. She washes away sorrow and wrongdoing, and gives peace of mind."},{"n":9,"name":"Siddhidatri","date":"20 October","tithi":"Navami","c":"#BE185D","epithet":"Giver of Perfection","text":"Seated on a lotus, worshipped by gods and sages alike, she grants the siddhis - wisdom, fulfilment, and the completion of all that was begun."}]}</script>

:root{
  --ground:#3A1416;
  --paper:#FDECC9; --paper2:#F8DCA6; --paper3:#F1CA86;
  --ink:#3B1C14; --ink-soft:#7A5433;
  --accent:#A82B22; --accent-ink:#FFF6EA;
  --gold:#8F6410; --gold-soft:#D9B25E;
  --band:#6C1B1D; --band-ink:#F6DFA9;
  --line:#EBCE97; --line-strong:#D9B370;
  --ok:#2C7A4C; --ok-bg:#E2F0E6;
  --warn:#916407; --warn-bg:#F7EAC9;
  --need:#1C6A67; --need-bg:#DCEEEB;
  --wa:#15803D;
  --edge:rgba(62,31,28,.16);
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#150A0C;
    --paper:#2A1A11; --paper2:#372417; --paper3:#43301E;
    --ink:#F6E6CC; --ink-soft:#C7A379;
    --accent:#E4644F; --accent-ink:#2A0E0B;
    --gold:#E0AA47; --gold-soft:#7E6129;
    --band:#38100F; --band-ink:#EFCE8E;
    --line:#4A3421; --line-strong:#61472C;
    --ok:#7ECB9E; --ok-bg:#1A3122;
    --warn:#E0B052; --warn-bg:#372B12;
    --need:#71C8BF; --need-bg:#11302E;
    --wa:#3FB56E;
    --edge:rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'Mukta','Segoe UI',system-ui,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex; flex-direction:column;
}
h1,h2,h3{font-family:'Eczar',Georgia,serif; text-wrap:balance; margin:0}

/* ================= shell ================= */
.topbar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
  color:var(--band-ink);
}
.topbar .mark{
  font-family:'Eczar',Georgia,serif; font-size:14.5px; font-weight:600;
  letter-spacing:.02em; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.9;
}
.topbar button{
  font:inherit; font-size:12.5px; font-weight:600; letter-spacing:.04em;
  color:var(--band-ink); background:rgba(255,255,255,.10);
  border:1px solid rgba(246,223,169,.32); border-radius:999px;
  padding:6px 13px; min-height:34px; cursor:pointer;
}
.topbar button:hover{background:rgba(255,255,255,.18)}

.stage{flex:1; min-height:0; padding:0 10px; display:flex; justify-content:center}
.book{
  position:relative; width:100%; max-width:760px; height:100%;
  perspective:2400px; perspective-origin:0% 50%;
}

/* ================= pages ================= */
.page{
  position:absolute; inset:0;
  background:var(--paper);
  border-radius:3px 13px 13px 3px;
  box-shadow:0 2px 4px rgba(0,0,0,.28), 0 14px 34px rgba(0,0,0,.34);
  display:none; flex-direction:column; overflow:hidden;
  transform-origin:left center;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  will-change:transform;
}
.page.on{display:flex}
.page::before{ /* binding shadow at the spine */
  content:""; position:absolute; left:0; top:0; bottom:0; width:30px; z-index:3;
  background:linear-gradient(to right, var(--edge), rgba(0,0,0,0));
  pointer-events:none;
}
.page::after{ /* gold binding rule */
  content:""; position:absolute; left:8px; top:14px; bottom:14px; width:2px; z-index:4;
  background:linear-gradient(to bottom, transparent, var(--gold-soft) 12%, var(--gold-soft) 88%, transparent);
  opacity:.75; pointer-events:none;
}
.sheet{
  flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:22px 22px 26px 34px;
  overscroll-behavior:contain;
}
.folio{
  flex:none; padding:7px 18px 9px 34px; border-top:1px solid var(--line);
  font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-soft); display:flex; justify-content:space-between; gap:10px;
  align-items:baseline;
}
.folio .fo-name{
  font-weight:600; color:var(--accent); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.folio > span:last-child{flex:none; white-space:nowrap}
@media (min-width:520px){ .folio{font-size:11px; letter-spacing:.07em} }

/* turning animation */
@keyframes turnAway{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(-168deg)}
}
@keyframes turnBackIn{
  from{transform:rotateY(-168deg)}
  to{transform:rotateY(0deg)}
}
.page.turn-away{animation:turnAway .58s cubic-bezier(.42,0,.35,1) forwards; z-index:9}
.page.turn-in{animation:turnBackIn .58s cubic-bezier(.42,0,.35,1) forwards; z-index:9}
.page.turn-away .shade,.page.turn-in .shade{opacity:1}
.shade{
  position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0;
  background:linear-gradient(to left, rgba(0,0,0,.30), rgba(0,0,0,0) 62%);
  transition:opacity .58s ease;
}
@media (prefers-reduced-motion: reduce){
  .page.turn-away,.page.turn-in{animation-duration:.01s}
  .shade{display:none}
}

/* ================= controls ================= */
.controls{
  flex:none; display:flex; align-items:center; gap:12px; justify-content:center;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
}
.nav{
  font:inherit; font-size:15px; font-weight:600; cursor:pointer;
  width:46px; height:46px; border-radius:50%;
  border:1px solid rgba(246,223,169,.30); background:rgba(255,255,255,.09);
  color:var(--band-ink); display:flex; align-items:center; justify-content:center;
}
.nav:hover:not(:disabled){background:rgba(255,255,255,.19)}
.nav:disabled{opacity:.3; cursor:default}
.nav svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.pips{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center; max-width:60vw}
.pip{
  width:8px; height:8px; border-radius:50%; padding:0; cursor:pointer;
  border:1px solid rgba(246,223,169,.42); background:transparent;
}
.pip.here{background:var(--gold); border-color:var(--gold); transform:scale(1.35)}
.pip:focus-visible,.nav:focus-visible,.topbar button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

/* ================= cover ================= */
.cover{background:linear-gradient(160deg,#7A1E20,#5A1517 62%,#4A1113)}
.cover .sheet{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; color:#F7E3B0; padding:30px 26px 30px 38px;
}
.cover .frame{
  border:1px solid rgba(216,178,94,.55); border-radius:6px;
  padding:22px 20px 20px; width:100%; max-width:420px;
  position:relative;
}
.cover .frame::before,.cover .frame::after{
  content:""; position:absolute; left:12px; right:12px; height:1px; background:rgba(216,178,94,.35);
}
.cover .frame::before{top:7px} .cover .frame::after{bottom:7px}
.cover .diya{width:64px; height:64px; margin:0 auto 16px; display:block}
.cover .durga{width:132px; height:auto; margin:0 auto 12px; display:block}
.bless .durga{width:104px; height:auto; margin:0 auto; display:block}
.cover .eyebrow{
  font-size:11.5px; letter-spacing:.22em; text-transform:uppercase;
  color:#D8B25E; margin-bottom:12px;
}
.cover h1{font-size:clamp(30px,7.4vw,42px); font-weight:700; line-height:1.12; color:#F9EDC8}
.cover .rule{width:54px; height:2px; background:#C89A32; margin:16px auto}
.cover .sub{font-size:14.5px; color:#EBD3A0; opacity:.92; margin:0}
.cover .dates{
  display:inline-block; margin-top:13px; padding:7px 18px;
  border:1px solid rgba(216,178,94,.6); border-radius:999px;
  font-family:'Eczar',Georgia,serif; font-size:14.5px; color:#F7E3B0;
}
.cover .open-hint{margin-top:14px; font-size:12.5px; color:#D8B25E; letter-spacing:.05em}
.cover .folio{border-top-color:rgba(216,178,94,.25); color:#C69C4E}

/* ================= page furniture ================= */
.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
  color:var(--dayc, var(--gold)); margin-bottom:5px;
}
.page-title{font-size:25px; font-weight:600; line-height:1.16}
.page-sub{font-size:14.5px; color:var(--ink-soft); margin-top:3px}
.hr{height:1px; background:var(--line); margin:15px 0}
.sec-lbl{
  font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--dayc, var(--gold)); margin:18px 0 7px;
  display:flex; align-items:center; gap:8px;
}
.sec-lbl::before{
  content:""; width:16px; height:3px; border-radius:2px; flex:none;
  background:var(--dayc, var(--gold));
}

/* dashboard */
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:12px}
.kpi{background:var(--paper2); border:1px solid var(--line); border-radius:9px; padding:11px 13px}
.kpi .n{font-family:'Eczar',Georgia,serif; font-size:26px; font-weight:600; line-height:1.05; color:var(--accent); font-variant-numeric:tabular-nums}
.kpi.g .n{color:var(--gold)}
.kpi .l{font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px}
.meter{margin-top:11px}
.meter .cap{font-size:12.5px; color:var(--ink-soft); display:flex; justify-content:space-between; gap:10px}
.meter .cap b{color:var(--ink); font-variant-numeric:tabular-nums}
.bar{height:8px; background:var(--paper3); border-radius:999px; overflow:hidden; margin-top:5px}
.bar > i{display:block; height:100%; border-radius:999px; transition:width .6s ease}
@media (prefers-reduced-motion: reduce){ .bar > i{transition:none} }
.bar.green > i{background:var(--ok)} .bar.gold > i{background:var(--gold)} .bar.red > i{background:var(--accent)}

/* live card */
.now{background:var(--paper2); border-left:3px solid var(--accent); border-radius:8px; padding:13px 15px; margin-top:14px}
.now-head{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:7px}
.dot-live{width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@media (prefers-reduced-motion: reduce){ .dot-live{animation:none} }
.now-big{font-family:'Eczar',Georgia,serif; font-size:19px; font-weight:600; margin:6px 0 0}
.now-sub{margin:5px 0 0; font-size:13.5px; color:var(--ink-soft)}
.now-sub b{color:var(--ink)}
.now-list{list-style:none; margin:9px 0 0; padding:0}
.now-list li{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px dashed var(--line); font-size:13.5px}
.now-list .t{color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums}
.now-list li.done{opacity:.45} .now-list li.done .n{text-decoration:line-through}
.now-list li.live .n{color:var(--accent); font-weight:700}
.tag{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:1px 7px; border-radius:999px; margin-left:7px; background:var(--ok-bg); color:var(--ok)}
.clock{font-size:11.5px; color:var(--ink-soft); margin-top:8px; font-variant-numeric:tabular-nums}

/* contents list */
.toc{list-style:none; margin:8px 0 0; padding:0}
.toc li{border-bottom:1px dotted var(--line-strong)}
.toc button{
  width:100%; text-align:left; font:inherit; cursor:pointer; background:none; border:none;
  display:flex; align-items:baseline; gap:10px; padding:11px 2px; color:var(--ink);
}
.toc .d{font-family:'Eczar',Georgia,serif; font-weight:700; font-size:14px; color:var(--accent); white-space:nowrap; min-width:58px}
.toc .t{flex:1; min-width:0; font-size:15px}
.toc .t em{display:block; font-style:normal; font-size:12.5px; color:var(--ink-soft)}
.toc .pg{font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.toc li.today .t{font-weight:700; color:var(--accent)}
.toc button:hover .t{color:var(--accent)}

/* schedule */
.sched{width:100%; border-collapse:collapse; font-size:14px}
.sched td{padding:6px 0; border-bottom:1px dashed var(--line); vertical-align:top}
.sched td:last-child{text-align:right; white-space:nowrap; color:var(--ink-soft); font-variant-numeric:tabular-nums; padding-left:14px}
.sched tr:last-child td{border-bottom:none}

.sg-note{margin:9px 0 0; font-size:13px; color:var(--ink-soft); text-align:center}
.sg-note.ok{color:var(--ok); font-weight:600}
.sg-note.bad{color:var(--accent); font-weight:600}

/* ---- shlokas ---- */
.shloka{
  margin:14px 0 0; padding:13px 15px; border-radius:10px;
  background:var(--paper2); border-left:3px solid var(--accent);
}
.shloka.compact{padding:10px 13px; margin-top:12px}
.sh-dev{
  margin:0; font-family:'Eczar',Georgia,serif; font-size:17px; font-weight:600;
  line-height:1.85; color:var(--ink); text-wrap:balance;
}
.shloka.compact .sh-dev{font-size:15.5px; line-height:1.8}
.sh-tr{margin:7px 0 0; font-size:12.5px; font-style:italic; color:var(--accent); line-height:1.5}
.sh-en{margin:5px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.5}
.cover .shloka{
  background:none; border:none; border-top:1px solid rgba(216,178,94,.35);
  border-bottom:1px solid rgba(216,178,94,.35); border-radius:0;
  padding:9px 4px; margin:12px 0 0;
}
.cover .sh-dev{color:#F3DFA8; font-size:15px; line-height:1.8}


.cover-art{margin:0 auto 8px; display:flex; justify-content:center}
.cover-art img{
  display:block; width:auto; height:19vh;
  max-height:158px; min-height:96px; max-width:55%;
  object-fit:contain;
}
@media (min-height:900px){ .cover-art img{height:22vh; max-height:210px} }


/* devi emblems */
.devi-n{position:relative; width:38px; height:38px}
.devi-em{width:21px; height:21px; color:#fff}
.devi-num{
  position:absolute; right:-3px; bottom:-3px; font-style:normal;
  width:17px; height:17px; border-radius:50%; background:var(--paper);
  color:var(--dc); border:1.5px solid var(--dc);
  font-family:'Eczar',Georgia,serif; font-weight:700; font-size:10.5px;
  display:flex; align-items:center; justify-content:center;
}
.dr-em{flex:none; width:24px; height:24px; color:var(--dc); display:flex; align-items:center}
.dr-em svg{width:24px; height:24px}

/* choose-your-programmes picker */
.pick-lead{margin:4px 0 0; font-size:14px; color:var(--ink-soft)}
.picker{margin-top:10px}
.pick-day{margin-top:12px}
.pick-h{
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); padding-bottom:5px; border-bottom:1px solid var(--line);
}
.pick{
  display:flex; align-items:center; gap:11px; padding:11px 4px;
  border-bottom:1px solid var(--line); cursor:pointer; min-height:46px;
}
.pick input{width:20px; height:20px; flex:none; accent-color:var(--accent)}
.pick .pk-n{flex:1; min-width:0; font-size:15.5px}
.pick .pk-t{
  flex:none; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  background:var(--ok-bg); color:var(--ok); border-radius:999px; padding:2px 9px;
}
.pick.done{opacity:.62; cursor:default}

/* register call to action on the cover */
.cover-cta{
  font:inherit; font-size:14px; font-weight:600; cursor:pointer; margin-top:14px;
  background:rgba(246,223,169,.12); color:#F7E3B0;
  border:1px solid rgba(216,178,94,.6); border-radius:999px;
  padding:9px 22px; min-height:42px;
}
.cover-cta:hover{background:rgba(246,223,169,.22)}


/* a band of the day's colour across the top of its page */
.page .sheet[style*="--dayc"]{
  background-image:linear-gradient(var(--dayc), var(--dayc));
  background-repeat:no-repeat; background-size:100% 4px; background-position:0 0;
}
.page .sheet[style*="--dayc"] .page-title{color:var(--ink)}

/* contents: a colourful card per day */
.daycards{display:grid; gap:9px; margin-top:10px}
.daycard{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  font:inherit; cursor:pointer; padding:11px 13px; border-radius:12px;
  background:linear-gradient(100deg, var(--dayc)1F, var(--dayc)0A 65%, transparent);
  border:1px solid var(--dayc)45; border-left:4px solid var(--dayc);
  color:var(--ink); min-height:66px;
}
.daycard:hover{background:linear-gradient(100deg, var(--dayc)30, var(--dayc)12 65%, transparent)}
.daycard.today{border-color:var(--dayc); box-shadow:0 0 0 2px var(--dayc)40}
.dc-date{
  flex:none; width:44px; text-align:center; color:var(--dayc);
  font-family:'Eczar',Georgia,serif; line-height:1;
}
.dc-date b{display:block; font-size:23px; font-weight:700}
.dc-date i{display:block; font-style:normal; font-size:10.5px; letter-spacing:.08em;
           text-transform:uppercase; margin-top:2px; opacity:.85}
.dc-main{flex:1; min-width:0}
.dc-t{display:block; font-family:'Eczar',Georgia,serif; font-size:17px; font-weight:600; line-height:1.2}
.dc-s{display:block; font-size:13px; color:var(--ink-soft); margin-top:1px}
.dc-devi{
  display:flex; align-items:center; gap:5px; margin-top:4px;
  font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--dayc);
}
.dc-devi svg{width:14px; height:14px}
.dc-pg{flex:none; font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.dc-now{
  flex:none; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  background:var(--dayc); color:#fff; border-radius:999px; padding:3px 10px;
}

/* the dots at the foot become a colour index of the book */
.pip{background:transparent; border-color:var(--pc, rgba(246,223,169,.42)); opacity:.55}
.pip.here{background:var(--pc, var(--gold)); border-color:var(--pc, var(--gold)); opacity:1; transform:scale(1.45)}
.pip:hover{opacity:.9}

/* meters with a little more life */
.bar.green > i{background:linear-gradient(90deg,#2C7A4C,#4FAE72)}
.bar.gold > i{background:linear-gradient(90deg,#B8801A,#E0AA47)}
.bar.red > i{background:linear-gradient(90deg,#A82B22,#D9603F)}

/* the day's colour flows into its furniture */
.sched caption{color:var(--dayc, var(--gold))}
.acts .act:first-child{border-top-color:var(--dayc, var(--line))}
.folio .fo-name{color:var(--dayc, var(--accent))}




/* how many are coming */
.counts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px}
.cnt{
  display:flex; flex-direction:column; gap:5px;
  background:var(--paper2); border:1px solid var(--line-strong);
  border-radius:9px; padding:9px 12px;
}
.cnt span{font-size:11.5px; font-weight:700; letter-spacing:.07em;
          text-transform:uppercase; color:var(--ink-soft)}


.stepper{display:flex; align-items:center; gap:10px}
.stp{
  flex:none; width:40px; height:40px; border-radius:50%; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--paper);
  color:var(--accent); font:inherit; font-size:20px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.stp:hover{border-color:var(--accent); background:var(--paper3)}
.stp:active{transform:scale(.94)}
.stp-v{
  flex:1; text-align:center; font-family:'Eczar',Georgia,serif;
  font-size:26px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;
}

/* how someone is taking part */
.rtag{
  display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px;
  font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  vertical-align:1px;
}
.rtag.perform{background:var(--need-bg); color:var(--need)}
.rtag.attend{background:var(--warn-bg); color:var(--warn)}
.rtag.help{background:var(--ok-bg); color:var(--ok)}
.pnote{font-style:normal; font-size:12.5px; color:var(--ink-soft)}

.pick-wrap{border-bottom:1px solid var(--line)}
.pick-wrap .pick{border-bottom:none}
.pick-wrap.done{opacity:.62}
.pick-role{display:flex; gap:6px; padding:0 4px 11px 35px; flex-wrap:wrap}
.pick-role[hidden]{display:none}
@media (max-width:420px){ .pick-role{padding-left:12px} }
.rbtn{
  font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--paper);
  color:var(--ink-soft); border-radius:999px; padding:7px 12px; min-height:36px;
}
.rbtn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.rbtn:hover{border-color:var(--accent)}

/* the aarti, laid out to be sung from */
.aarti{margin-top:14px}
.verse{
  padding:13px 15px; border-radius:10px; margin-top:10px;
  background:var(--paper2); border-left:3px solid var(--gold);
}
.v-dev{margin:0; font-family:'Eczar',Georgia,serif; font-size:17.5px; font-weight:600;
       line-height:1.95; color:var(--ink)}
.v-tr{margin:6px 0 0; font-size:12.5px; font-style:italic; color:var(--ink-soft); line-height:1.5}
.v-ref{
  margin:9px 0 0; padding-top:8px; border-top:1px dashed var(--line-strong);
  font-family:'Eczar',Georgia,serif; font-size:16px; font-weight:700;
  color:var(--accent); text-align:center;
}
.aarti-cta{
  font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; margin-top:10px;
  background:var(--accent); color:var(--accent-ink); border:none;
  border-radius:9px; padding:10px 16px; min-height:42px; width:100%;
}

/* what each ritual means */
.sched td .why{
  display:block; font-style:normal; font-size:12.5px; line-height:1.45;
  color:var(--ink-soft); margin-top:3px; padding-right:10px;
}

/* thank you page */
.thanks{margin-top:14px}
.thank{
  padding:12px 14px; border-radius:10px; margin-top:9px;
  background:var(--paper2); border-left:3px solid var(--gold);
}
.th-t{font-family:'Eczar',Georgia,serif; font-size:17px; font-weight:600; color:var(--ink)}
.th-s{font-size:13.5px; color:var(--ink-soft); margin-top:2px}

/* ---- venue + QR ---- */
.venue{
  display:flex; gap:14px; align-items:center; margin:14px 0 0;
  padding:13px 15px; border-radius:11px;
  background:var(--paper2); border:1px solid var(--line-strong);
}
.venue-qr{flex:none; width:88px; height:88px; background:#fff; border-radius:8px; padding:5px;
          box-shadow:0 1px 4px rgba(0,0,0,.18)}
.venue-qr svg{display:block; width:100%; height:100%}
.venue-i{min-width:0}
.venue-lbl{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
.venue-name{margin:3px 0 0; font-family:'Eczar',Georgia,serif; font-size:17px; font-weight:600; line-height:1.25}
.venue-link{display:inline-block; margin-top:5px; font-size:13.5px; font-weight:600; color:var(--accent)}
.venue-hint{margin:3px 0 0; font-size:11.5px; color:var(--ink-soft)}
.cover-venue{margin:9px 0 0; font-size:13.5px; color:#EBD3A0; opacity:.95}
@media (max-width:400px){ .venue{gap:11px} .venue-qr{width:74px; height:74px} }

/* ---- Navadurga: nine devis ---- */
.devi-list{display:grid; gap:11px; margin-top:14px}
.devi{
  position:relative; border-radius:11px; padding:14px 15px 13px 17px;
  background:linear-gradient(105deg, var(--dc)1F, var(--dc)08 62%, transparent);
  border:1px solid var(--dc)3D; overflow:hidden;
}
.devi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--dc)}
.devi-top{display:flex; gap:11px; align-items:center}
.devi-n{
  flex:none; width:32px; height:32px; border-radius:50%; background:var(--dc); color:#fff;
  font-family:'Eczar',Georgia,serif; font-weight:700; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px var(--dc)59;
}
.devi-id{min-width:0}
.devi-id h3{font-size:19px; font-weight:600; line-height:1.2; color:var(--ink)}
.devi-ep{margin:0; font-size:13px; font-weight:600; color:var(--dc); letter-spacing:.01em}
.devi-when{
  margin:9px 0 0; font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft);
}
.devi-text{margin:5px 0 0; font-size:14.5px; color:var(--ink); line-height:1.55}

/* the devi banner on a day page */
.devi-ribbon{
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
  margin:12px 0 2px; padding:9px 13px; border-radius:9px;
  background:linear-gradient(100deg, var(--dc)24, var(--dc)0A 70%, transparent);
  border-left:3px solid var(--dc);
}
.dr-n{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--dc)}
.dr-name{font-family:'Eczar',Georgia,serif; font-size:17px; font-weight:600; color:var(--ink)}
.dr-ep{font-size:12.5px; color:var(--ink-soft)}

/* meals table reads a touch quieter than the puja one */
.sched.meals td:first-child{font-weight:600}

/* activities */
.acts{list-style:none; margin:0; padding:0}
.act{padding:14px 0; border-top:1px solid var(--line)}
.act:first-child{border-top:none}
.act-top{display:flex; gap:9px; align-items:flex-start; flex-wrap:wrap}
.act-main{flex:1 1 210px; min-width:0}
.act-name{font-weight:600; font-size:16px}
.act-who{font-size:13.5px; color:var(--ink-soft); margin-top:1px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap}
.chip::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.chip.confirmed{background:var(--ok-bg); color:var(--ok)}
.chip.discussion{background:var(--warn-bg); color:var(--warn)}
.chip.ideas{background:var(--need-bg); color:var(--need)}

.tl{margin:10px 0 0; padding:10px 12px; background:var(--paper2); border-radius:8px}
.tl-head{display:flex; justify-content:space-between; gap:9px; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft)}
.tl-head .st{color:var(--gold); text-align:right}
.tl-head .st.late{color:var(--accent)}
.tl-track{display:flex; gap:4px; margin:8px 0 7px}
.tl-track i{flex:1; height:6px; border-radius:3px; background:var(--paper3)}
.tl-track i.on{background:var(--gold)}
.tl-steps{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; font-size:10.5px; color:var(--ink-soft); line-height:1.35}
.tl-steps span.on{color:var(--ink); font-weight:600}
.tl-steps em{display:block; font-style:normal; opacity:.75; font-variant-numeric:tabular-nums}
@media (max-width:520px){ .tl-steps{grid-template-columns:repeat(2,1fr); gap:6px 4px} }

.ppl{margin:10px 0 0}
.ppl-lbl{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft)}
.names{display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 0; padding:0; list-style:none}
.names li{background:var(--paper2); border:1px solid var(--line-strong); border-radius:999px; padding:2px 11px; font-size:13px}
.names li.mine{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600}
.names li.pending{background:var(--warn-bg); border-color:var(--warn); color:var(--warn); font-weight:600}
.names li.empty{border-style:dashed; background:transparent; color:var(--ink-soft)}
.join{display:flex; gap:7px; margin-top:8px; flex-wrap:wrap}
.join input{
  flex:1 1 170px; min-width:0; padding:10px 12px; border:1px solid var(--line-strong);
  border-radius:8px; background:var(--paper); color:var(--ink); font:inherit; font-size:16px;
}
.join input::placeholder{color:var(--ink-soft); opacity:.85}
.btn{
  font:inherit; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none;
  padding:10px 16px; min-height:42px; border-radius:8px; border:none;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  background:var(--accent); color:var(--accent-ink);
}
.btn.wa{background:var(--wa); color:#fff}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--line-strong)}
.btn.wide{width:100%}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.note{margin:14px 0 0; font-size:13.5px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:11px}
.album-link{display:inline-block; margin-top:9px; font-weight:600; color:var(--accent)}

/* registration */
.regcard{
  display:flex; align-items:center; gap:11px; margin-top:12px;
  background:var(--paper2); border:1px solid var(--line-strong); border-radius:10px; padding:12px 14px;
}
.regcard .rc-i{flex:1; min-width:0}
.regcard .rc-n{font-family:'Eczar',Georgia,serif; font-size:18px; font-weight:600; line-height:1.2}
.regcard .rc-p{font-size:13.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.regcard .btn{min-height:38px; padding:8px 15px; font-size:13.5px}
.regnote{
  display:flex; gap:10px; align-items:center; margin-top:12px; padding:11px 13px;
  background:var(--paper2); border:1px dashed var(--line-strong); border-radius:9px;
  font-size:13.5px; color:var(--ink-soft);
}
.regnote b{color:var(--ink)}
.regnote button{
  font:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
  padding:8px 14px; min-height:38px;
}

/* roster of registered participants */
.roster{list-style:none; margin:8px 0 0; padding:0}
.roster li{
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  padding:8px 0; border-bottom:1px dotted var(--line-strong); font-size:14.5px;
}
.roster li:last-child{border-bottom:none}
.roster .rn{flex:1; min-width:0}
.roster .rn em{font-style:normal; font-size:11px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ok); background:var(--ok-bg);
  border-radius:999px; padding:1px 7px; margin-left:5px}
.roster .rp{color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:13.5px; white-space:nowrap}
.roster li.me .rn{font-weight:700; color:var(--accent)}
.roster li.pend .rn em{color:var(--warn); background:var(--warn-bg)}
.rcount{
  display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px;
  background:var(--paper3); color:var(--ink-soft);
  font-size:11px; font-weight:700; vertical-align:1px;
}
.roster-note{font-size:12.5px; color:var(--ink-soft); margin:9px 0 0}
.roster-note b{color:var(--ink)}
/* organiser controls */
.orgx{display:inline-flex; gap:5px; margin-left:8px}
.orgx button{
  font:inherit; font-size:11px; font-weight:700; letter-spacing:.04em; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--paper); color:var(--ink-soft);
  border-radius:999px; padding:2px 9px; line-height:1.5;
}
.orgx .od{color:var(--accent); border-color:var(--accent)}
.orgx button:hover{filter:brightness(.96)}
.orgbar{margin-top:20px; padding-top:14px; border-top:1px solid var(--line)}
.orglink{
  font:inherit; font-size:12.5px; cursor:pointer; background:none; border:none;
  color:var(--ink-soft); text-decoration:underline; padding:4px 0;
}
.orglink:hover{color:var(--accent)}
.orgnote{font-size:13px; color:var(--ink-soft); margin:0 0 10px}
.orgnote b{color:var(--accent)}

.livedot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--ok); margin-right:5px; vertical-align:1px;
  animation:pulse 2.2s infinite;
}

/* entries */
.entries{list-style:none; margin:10px 0 0; padding:0}
.entries li{border-top:1px solid var(--line); padding:10px 0; display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.entries .b{flex:1 1 180px; min-width:0}
.entries .w{font-size:12.5px; color:var(--ink-soft)}
.entries .x-t{font-size:14.5px; font-weight:600}
.state{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:999px}
.state.sent{background:var(--ok-bg); color:var(--ok)}
.state.pending{background:var(--warn-bg); color:var(--warn)}
.rm{border:none; background:none; color:var(--accent); font-size:16px; font-weight:700; cursor:pointer; line-height:1; padding:4px 6px}
.stack{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.preview{
  margin-top:11px; padding:10px 12px; background:var(--paper2); border-radius:8px;
  font-size:13px; color:var(--ink-soft); white-space:pre-wrap; word-break:break-word;
  border:1px dashed var(--line-strong); display:none;
}
.preview.show{display:block}
.empty-note{font-size:14px; color:var(--ink-soft); margin-top:12px}

/* forms */
.field{display:grid; gap:8px; margin-top:12px}
.field input,.field select,.field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px;
  background:var(--paper2); color:var(--ink); font:inherit; font-size:16px;
}
.field textarea{min-height:96px; resize:vertical}

/* steps / help */
.steps{margin:8px 0 0; padding-left:20px; font-size:14px; color:var(--ink-soft)}
.steps li{margin:5px 0} .steps b{color:var(--ink)}

/* install */
.install{display:none; gap:11px; align-items:flex-start; background:var(--paper2); border:1px solid var(--line-strong); border-radius:9px; padding:12px 13px; margin-top:16px}
.install.show{display:flex}
.install img{width:34px; height:34px; border-radius:8px; flex:none}
.install .t{flex:1; min-width:0; font-size:13.5px; color:var(--ink-soft)}
.install .t b{display:block; color:var(--ink); font-size:14.5px; margin-bottom:1px}

/* blessing */
.bless{text-align:center; padding-top:8px}
.bless .rule{width:54px; height:2px; background:var(--gold); margin:14px auto}
.bless h2{font-size:23px}
.bless p{font-size:14px; color:var(--ink-soft); max-width:430px; margin:8px auto}
.bless .om{font-family:'Eczar',Georgia,serif; font-size:15px; color:var(--gold); letter-spacing:.14em; text-transform:uppercase}

#toast{
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
  background:var(--band); color:var(--band-ink); padding:11px 19px; border-radius:9px;
  font-size:14px; box-shadow:0 6px 22px rgba(0,0,0,.4); opacity:0; pointer-events:none;
  transition:opacity .25s ease; max-width:90vw; text-align:center; z-index:80;
}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }

@media (min-width:700px){
  .sheet{padding:28px 34px 30px 44px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .page-title{font-size:28px}
}

@media print{
  body{overflow:visible; background:#fff; display:block; height:auto}
  .topbar,.controls,#toast,.join,.stack,.field,.install,.preview,.btn{display:none !important}
  .stage{display:block; padding:0}
  .book{height:auto; perspective:none; max-width:none}
  .page{position:static; display:flex !important; box-shadow:none; border-radius:0;
        animation:none !important; transform:none !important; break-after:page; background:#fff}
  .page::before,.page::after,.shade{display:none}
  .sheet{overflow:visible; padding:14px 0}
  .cover{background:#fff} .cover .sheet{color:#111} .cover h1,.cover .sub,.cover .dates{color:#111}
  .chip{background:#eee !important; color:#111 !important}
}
</style>

<body>

<div class="topbar">
  <span class="mark">Sharadiya Durga Puja 2026 (Laos)</span>
  <button type="button" id="btn-contents">Contents</button>
</div>

<div class="stage">
  <div class="book" id="book"></div>
</div>

<div class="controls">
  <button class="nav" id="prev" type="button" aria-label="Previous page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="pips" id="pips"></div>
  <button class="nav" id="next" type="button" aria-label="Next page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var S = JSON.parse(document.getElementById('pb-state').textContent);
  var PHONE = S.phone || '';
  var KEY = 'durgapuja2026-entries';
  var STATUS_LABEL = {confirmed:'Confirmed', discussion:'In discussion', ideas:'Ideas welcome'};
  var MILESTONES = [
    {perform:'Names collected',   prep:'Ideas collected',    m:8, d:25},
    {perform:'Practice begins',   prep:'Materials arranged', m:9, d:5},
    {perform:'Sequence fixed',    prep:'Setup planned',      m:9, d:12},
    {perform:'Ready for the day', prep:'Ready for the day',  m:9, d:15}
  ];
  var PUJA_START = new Date(2026, 9, 16);
  var PUJA_END = new Date(2026, 9, 21, 23, 59);
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 3800);
  }
  function waLink(text){
    return (PHONE ? 'https://wa.me/' + PHONE + '?text=' : 'https://wa.me/?text=')
           + encodeURIComponent(text);
  }
  function copyText(text){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.top='-1000px';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); return ok;
    }
    var done = function(ok){
      toast(ok ? 'Text copied. Paste it into your WhatsApp group.'
               : 'Please select the text shown and copy it.');
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); },
                                              function(){ done(fallback()); });
    } else { done(fallback()); }
  }

  /* ---------- entries saved on this device ---------- */
  var mine = [];
  try{ mine = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ mine = []; }
  function saveMine(){ try{ localStorage.setItem(KEY, JSON.stringify(mine)); }catch(e){} }
  function myFor(d,a){ return mine.filter(function(e){ return e.day===d && e.act===a; }); }

  /* ---------- registration: name + phone only ---------- */
  var MEKEY = 'durgapuja2026-me';
  var me = {name:'', phone:'', adults:1, children:0};
  try{
    var raw = JSON.parse(localStorage.getItem(MEKEY));
    if(raw && raw.name) me = {name:raw.name || '', phone:raw.phone || '',
                              adults:+raw.adults || 1, children:+raw.children || 0};
  }catch(e){}
  function partySize(){ return (+me.adults || 0) + (+me.children || 0); }
  function partyText(){
    var a = +me.adults || 0, c = +me.children || 0, t = a + c;
    return t + ' coming' + (c ? ' (' + c + ' ' + (c === 1 ? 'child' : 'children') + ')' : '');
  }
  function saveMe(){ try{ localStorage.setItem(MEKEY, JSON.stringify(me)); }catch(e){} }
  function registered(){ return !!(me.name && me.phone); }
  var editing = false;
  function showForm(){ return editing || !registered(); }
  function digits(s){ return String(s).replace(/[^0-9]/g,''); }
  function myLabel(detail){ return me.name + (detail ? ' - ' + detail : ''); }
  /* the running order of the book, in one place */
  var PAGES = (function(){
    var a = ['cover','contents','devis','aarti'];
    for (var i = 0; i < S.days.length; i++) a.push('day' + i);
    a.push('register','suggest','thanks','blessing');
    return a;
  })();
  function pageOf(kind){ return PAGES.indexOf(kind); }      /* 0-based */
  function pageNo(kind){ return PAGES.indexOf(kind) + 1; }  /* as printed */
  var REG_PAGE = pageNo('register');

  /* ---------- shared list (optional Google Sheet backend) ----------
     With no endpoint the book behaves exactly as before: everything stays on
     this phone and reaches the organisers by WhatsApp. With an endpoint, names
     are shared live between everyone holding the book. Phone numbers are sent
     to the sheet but are never read back into the page. */
  var ENDPOINT = String(S.endpoint || '').trim();
  var live = {registrations:[], joins:[]};
  var liveState = ENDPOINT ? 'loading' : 'off';   /* off | loading | ok | error */

  function fetchLive(cb){
    if(!ENDPOINT){ liveState = 'off'; if(cb) cb(); return; }
    var url = ENDPOINT + (ENDPOINT.indexOf('?') > -1 ? '&' : '?')
            + 'action=list&t=' + (new Date()).getTime();
    fetch(url, {method:'GET'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok){
          live.registrations = d.registrations || [];
          live.joins = d.joins || [];
          liveState = 'ok';
        } else { liveState = 'error'; }
        if(cb) cb();
      })
      .catch(function(){ liveState = 'error'; if(cb) cb(); });
  }

  function apiPost(payload, cb){
    if(!ENDPOINT){ if(cb) cb(false); return; }
    /* text/plain keeps this a simple request, so no CORS preflight is needed */
    fetch(ENDPOINT, {method:'POST',
                     headers:{'Content-Type':'text/plain;charset=utf-8'},
                     body:JSON.stringify(payload)})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(cb) cb(!!(d && d.ok)); })
      .catch(function(){ if(cb) cb(false); });
  }

  function joinsFor(dayId, actId){
    if(liveState !== 'ok') return [];
    return live.joins.filter(function(j){ return j.day === dayId && j.act === actId; });
  }

  /* ---------- organiser mode ----------
     Lets the organisers correct or remove any name. Unlocked with a passcode
     kept on the device. With the sheet connected, a change reaches everyone;
     without it, the change applies to this copy of the book only. */
  var ORG_KEY = 'durga2026';
  var orgMode = false;
  try{ orgMode = localStorage.getItem('durgapuja2026-org') === 'on'; }catch(e){}
  function setOrg(on){
    orgMode = on;
    try{ localStorage.setItem('durgapuja2026-org', on ? 'on' : 'off'); }catch(e){}
  }
  function orgTools(name, kind, ref){
    if(!orgMode) return '';
    return '<span class="orgx">'
      + '<button type="button" class="oe" data-edit-' + kind + '="' + esc(ref) + '" '
      + 'data-name="' + esc(name) + '" aria-label="Rename ' + esc(name) + '">Rename</button>'
      + '<button type="button" class="od" data-del-' + kind + '="' + esc(ref) + '" '
      + 'data-name="' + esc(name) + '" aria-label="Remove ' + esc(name) + '">Remove</button></span>';
  }
  function applyOrgChange(btn, op, oldName, newName){
    var joinRef = btn.getAttribute('data-edit-join') || btn.getAttribute('data-del-join');
    var regRef  = btn.getAttribute('data-edit-reg')  || btn.getAttribute('data-del-reg');
    var bakeRef = btn.getAttribute('data-edit-baked')|| btn.getAttribute('data-del-baked');
    var doneMsg = op === 'delete' ? 'Removed ' + oldName + '.' : 'Renamed to ' + newName + '.';

    if(bakeRef){                       /* a name printed in the book itself */
      var bp = bakeRef.split('|');
      var day = S.days.filter(function(d){ return d.id === bp[0]; })[0];
      var act = day && day.activities.filter(function(a){ return a.id === bp[1]; })[0];
      if(act){
        if(op === 'delete') act.names.splice(+bp[2], 1);
        else act.names[+bp[2]] = newName;
      }
      afterOrgChange(doneMsg);
      return;
    }

    if(regRef){                        /* a registered participant */
      if(ENDPOINT){
        apiPost({action: op === 'delete' ? 'deleteReg' : 'renameReg',
                 key:ORG_KEY, name:oldName, newName:newName}, function(ok){
          afterOrgChange(ok ? doneMsg : 'Could not save that change.');
        });
      } else {
        var lr = S.registrations || [];
        for(var i=lr.length-1;i>=0;i--){
          if(lr[i].name === oldName){
            if(op === 'delete') lr.splice(i,1); else lr[i].name = newName;
          }
        }
        afterOrgChange(doneMsg);
      }
      return;
    }

    if(joinRef){                       /* someone who joined a programme */
      var jp = joinRef.split('|');
      if(ENDPOINT){
        apiPost({action: op === 'delete' ? 'deleteJoin' : 'renameJoin',
                 key:ORG_KEY, day:jp[0], act:jp[1], name:oldName, newName:newName},
          function(ok){ afterOrgChange(ok ? doneMsg : 'Could not save that change.'); });
      } else {
        afterOrgChange(doneMsg);
      }
    }
  }

  function afterOrgChange(msg){
    if(ENDPOINT){
      fetchLive(function(){
        var p = activePage(); var sc = p ? p.querySelector('.sheet').scrollTop : 0;
        mount(current);
        var p2 = activePage(); if(p2) p2.querySelector('.sheet').scrollTop = sc;
        toast(msg);
      });
    } else {
      var p = activePage(); var sc = p ? p.querySelector('.sheet').scrollTop : 0;
      mount(current);
      var p2 = activePage(); if(p2) p2.querySelector('.sheet').scrollTop = sc;
      toast(msg + ' (this copy only - connect the sheet to change it for everyone)');
    }
  }

  /* ---------- time + milestones ---------- */
  function msDate(ms){ return new Date(2026, ms.m, ms.d); }
  function prepState(kind, now){
    var reached = 0, next = null;
    for(var i=0;i<MILESTONES.length;i++){
      if(now >= msDate(MILESTONES[i])) reached = i+1;
      else if(!next) next = {i:i, ms:MILESTONES[i]};
    }
    var out = {reached:reached, label:'Ready', due:'', late:false};
    if(next){
      var days = Math.round((msDate(next.ms) - now) / 86400000);
      out.label = next.ms[kind];
      out.due = days <= 0 ? 'due today' : (days === 1 ? 'in 1 day' : 'in ' + days + ' days');
      if(days < 0){ out.late = true; out.due = 'overdue'; }
    }
    return out;
  }
  function parseTimes(s){
    var re = /(\d{1,2}):(\d{2})\s*(AM|PM)/g, m, out = [];
    while((m = re.exec(s))){
      var h = (+m[1]) % 12; if(m[3]==='PM') h += 12;
      out.push(h*60 + (+m[2]));
    }
    return out;
  }
  function todayIndex(now){
    if(now < PUJA_START || now > PUJA_END) return -1;
    return Math.min(S.days.length-1, Math.floor((now - PUJA_START)/86400000));
  }
  function timeStr(dt){
    var h = dt.getHours(), m = dt.getMinutes(), ap = h<12 ? 'AM':'PM';
    h = h%12; if(h===0) h=12;
    return h + ':' + (m<10?'0'+m:m) + ' ' + ap;
  }
  function totals(){
    var t={total:0,conf:0,open:0,listed:0};
    S.days.forEach(function(d){ d.activities.forEach(function(a){
      t.total++; if(a.status==='confirmed') t.conf++; else t.open++;
      t.listed += a.names.length;
    });});
    return t;
  }

  /* how someone is taking part - kept inside the detail field, so the
     Google Sheet needs no change at all */
  var ROLES = ['Performing', 'Joining as viewer', 'Helping in arrangements'];
  /* older wordings, so anything already saved still reads correctly */
  var ROLES_OLD = {'Taking part': 'Joining as viewer', 'Helping': 'Helping in arrangements'};
  function defaultRole(a){ return a.kind === 'prep' ? ROLES[2] : ROLES[0]; }
  function splitRole(detail){
    var d = String(detail || ''), all = ROLES.concat(Object.keys(ROLES_OLD));
    for (var i = 0; i < all.length; i++) {
      if (d.indexOf(all[i]) === 0) {
        return {role: ROLES_OLD[all[i]] || all[i],
                note: d.slice(all[i].length).replace(/^\s*[-:]\s*/, '')};
      }
    }
    return {role: '', note: d};
  }
  function roleTag(role){
    if(!role) return '';
    var cls = role === ROLES[0] ? 'perform' : (role === ROLES[2] ? 'help' : 'attend');
    return '<span class="rtag ' + cls + '">' + esc(role) + '</span>';
  }

  /* ================= book engine ================= */
  var book = document.getElementById('book');
  var current = 0, pageCount = PAGES.length, busy = false;

  function buildPage(i, now){
    var k = PAGES[i];
    if(k === 'cover')     return {cls:'page cover', html:coverPage(now)};
    if(k === 'contents')  return {cls:'page', html:contentsPage(now)};
    if(k === 'devis')     return {cls:'page', html:devisPage()};
    if(k === 'aarti')     return {cls:'page', html:aartiPage()};
    if(k === 'register')  return {cls:'page', html:entriesPage()};
    if(k === 'suggest')   return {cls:'page', html:suggestPage()};
    if(k === 'thanks')    return {cls:'page', html:thanksPage()};
    if(k === 'blessing')  return {cls:'page', html:blessingPage()};
    var di = parseInt(k.slice(3), 10);
    return {cls:'page', html:dayPage(S.days[di], di, now)};
  }

  function renderPage(i){
    var now = new Date();
    var spec = buildPage(i, now);
    var el = document.createElement('div');
    el.className = spec.cls;
    el.setAttribute('data-i', i);
    el.innerHTML = spec.html + '<div class="shade"></div>';
    return el;
  }

  function activePage(){
    return book.querySelector('.page[data-i="' + current + '"]');
  }

  function mount(i){
    book.innerHTML = '';
    var el = renderPage(i);
    el.classList.add('on');
    book.appendChild(el);
    current = i;
    afterMount();
  }

  function go(i, dir){
    if(busy || i < 0 || i >= pageCount || i === current) return;
    busy = true;
    var old = book.querySelector('.page.on');
    var next = renderPage(i);
    next.classList.add('on');

    if(dir > 0){
      book.insertBefore(next, old);        // new page sits underneath
      old.classList.add('turn-away');
    } else {
      book.appendChild(next);              // new page turns in on top
      next.classList.add('turn-in');
    }
    current = i;

    window.setTimeout(function(){
      if(old && old.parentNode) old.parentNode.removeChild(old);
      next.classList.remove('turn-in');
      busy = false;
      afterMount();
    }, 600);

    updatePips();
  }

  function afterMount(){
    updatePips();
    document.getElementById('prev').disabled = current === 0;
    document.getElementById('next').disabled = current === pageCount - 1;
    if(current === 1){ refreshMeters(); refreshNow(); installHint(); }
    if(PAGES[current] === 'register') wireEntries();
    if(PAGES[current] === 'suggest') wireSuggest();
    var pg = activePage();
    var sh = pg && pg.querySelector('.sheet');
    if(sh) sh.scrollTop = 0;
  }

  function updatePips(){
    var box = document.getElementById('pips');
    var html = '';
    for(var i=0;i<pageCount;i++){
      html += '<button class="pip' + (i===current?' here':'') + '" type="button" data-pip="' + i
            + '" style="--pc:' + pageColour(i) + '" aria-label="Page ' + (i+1) + '"></button>';
    }
    box.innerHTML = html;
  }

  /* ================= live bits ================= */
  function refreshMeters(){
    var now = new Date(), t = totals();
    var dEl = document.getElementById('k-days'), dL = document.getElementById('k-days-l');
    if(dEl){
      if(now > PUJA_END){ dEl.textContent='0'; dL.textContent='Complete'; }
      else if(now >= PUJA_START){ dEl.textContent='Day ' + (todayIndex(now)+1); dL.textContent='of 6'; }
      else { dEl.textContent = Math.ceil((PUJA_START-now)/86400000); dL.textContent='Days to go'; }
    }
    var p = document.getElementById('k-ppl');
    if(p) p.textContent = t.listed + mine.length;
    var p1 = t.total ? Math.round(t.conf/t.total*100) : 0;
    var m1 = document.getElementById('m1'), m1v = document.getElementById('m1v');
    if(m1){ m1.style.width = p1+'%'; m1v.textContent = p1+'%'; }
    var st = prepState('perform', now);
    var p2 = Math.round(st.reached/MILESTONES.length*100);
    var m2 = document.getElementById('m2'), m2v = document.getElementById('m2v'),
        m2c = document.getElementById('m2c');
    if(m2){
      m2.style.width = p2+'%'; m2v.textContent = p2+'%';
      m2c.textContent = now >= PUJA_START ? 'Preparation complete'
                        : 'Preparation: ' + st.label + (st.due ? ' ' + st.due : '');
    }
    var f2 = document.getElementById('folio-2');
    if(f2) f2.textContent = 'Page 2';
  }

  function refreshNow(){
    var el = document.getElementById('now');
    if(!el) return;
    var now = new Date();

    if(now < PUJA_START){
      var days = Math.ceil((PUJA_START-now)/86400000);
      var st = prepState('perform', now);
      el.innerHTML = '<div class="now-head"><span class="dot-live"></span>Countdown</div>'
        + '<p class="now-big">' + days + ' days to go</p>'
        + '<p class="now-sub"><b>Stage:</b> ' + esc(st.label) + (st.due ? ' &middot; ' + esc(st.due) : '') + '</p>'
        + '<p class="now-sub">From 16 October this turns into the live agenda &mdash; what is '
        + 'happening now and what is next.</p>'
        + '<p class="clock">Updates itself &middot; ' + timeStr(now) + '</p>';
      return;
    }
    if(now > PUJA_END){
      el.innerHTML = '<div class="now-head"><span class="dot-live"></span>Complete</div>'
        + '<p class="now-big">Shubho Bijoya</p>'
        + '<p class="now-sub">Thank you everyone for a beautiful Durga Puja 2026.</p>';
      return;
    }
    var idx = todayIndex(now), d = S.days[idx];
    var mins = now.getHours()*60 + now.getMinutes();
    var live = '', nxt = '';
    var rows = d.puja.map(function(r){
      var ts = parseTimes(r[1]), cls = 'later';
      if(ts.length >= 2){ if(mins > ts[1]) cls='done'; else if(mins >= ts[0]) cls='live'; }
      else if(ts.length === 1){ if(mins > ts[0]+75) cls='done'; else if(mins >= ts[0]) cls='live'; }
      if(cls==='live' && !live) live = r[0];
      if(cls==='later' && ts.length && !nxt){
        var away = ts[0]-mins;
        nxt = r[0] + ' at ' + r[1] + (away>0 && away<240 ? ' (in ' + away + ' min)' : '');
      }
      return '<li class="'+cls+'"><span class="n">' + esc(r[0])
        + (cls==='live' ? '<span class="tag">Now</span>' : '')
        + '</span><span class="t">' + esc(r[1]) + '</span></li>';
    }).join('');
    el.innerHTML = '<div class="now-head"><span class="dot-live"></span>Today &middot; Day '
      + (idx+1) + ' of 6</div>'
      + '<p class="now-big">' + esc(d.title) + '</p>'
      + (live ? '<p class="now-sub"><b>Happening now:</b> ' + esc(live) + '</p>'
              : (nxt ? '<p class="now-sub"><b>Up next:</b> ' + esc(nxt) + '</p>' : ''))
      + '<ul class="now-list">' + rows + '</ul>'
      + '<button class="aarti-cta" type="button" data-go="' + pageNo('aarti') + '">'
        + (mins >= 360 && mins <= 420 ? 'Aarti now - open the words' : 'Open the aarti') + '</button>'
      + (d.album ? '<a class="album-link" href="' + esc(d.album) + '" target="_blank" rel="noopener">Today&#39;s photos</a>' : '')
      + '<p class="clock">Updates itself &middot; ' + timeStr(now) + '</p>';
  }

  function postSuggestion(cb){
    var n = document.getElementById('sg-name'), t = document.getElementById('sg-text'),
        c = document.getElementById('sg-cat');
    if(!n || !t || !c){ if(cb) cb(false); return; }
    var name = n.value.trim(), text = t.value.trim();
    if(!name || !text){ if(cb) cb(false); return; }
    apiPost({action:'suggest', name:name, phone:me.phone || 'not given',
             topic:c.value, text:text}, function(ok){ if(cb) cb(ok); });
  }

  function suggestionMessage(){
    var n = document.getElementById('sg-name'), t = document.getElementById('sg-text'),
        c = document.getElementById('sg-cat');
    if(!n || !t || !c) return null;
    var name = n.value.trim(), text = t.value.trim();
    if(!name || !text) return null;
    return 'Durga Puja 2026 - suggestion\nFrom: ' + name
         + (me.phone ? '\nPhone: ' + me.phone : '')
         + '\nTopic: ' + c.value + '\nIdea: ' + text;
  }
  function wireSuggest(){
    var a = document.getElementById('sg-send');
    if(!a) return;
    ['sg-name','sg-text','sg-cat'].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', function(){ var m = suggestionMessage(); a.href = m ? waLink(m) : '#'; });
      el.addEventListener('change', function(){ var m = suggestionMessage(); a.href = m ? waLink(m) : '#'; });
    });
    a.addEventListener('click', function(ev){
      var m = suggestionMessage();
      if(!m){ ev.preventDefault(); toast('Please add your name and your idea first.'); return; }
      this.href = waLink(m);
      postSuggestion();
    });
    document.getElementById('sg-copy').addEventListener('click', function(){
      var m = suggestionMessage();
      if(!m){ toast('Please add your name and your idea first.'); return; }
      copyText(m);
      postSuggestion();
    });

    var sub = document.getElementById('sg-submit');
    if(sub) sub.addEventListener('click', function(){
      var note = document.getElementById('sg-note');
      var n = document.getElementById('sg-name').value.trim();
      var t = document.getElementById('sg-text').value.trim();
      if(!n || !t){
        toast('Please add your name and your idea first.');
        if(note){ note.className = 'sg-note bad'; note.textContent = 'Your name and your idea are both needed.'; }
        return;
      }
      if(!ENDPOINT){
        toast('Use the WhatsApp button to send this to the organisers.');
        if(note){ note.className='sg-note bad'; note.textContent='No shared list connected - send it on WhatsApp instead.'; }
        return;
      }
      sub.disabled = true;
      if(note){ note.className='sg-note'; note.textContent='Sending...'; }
      postSuggestion(function(ok){
        sub.disabled = false;
        if(ok){
          document.getElementById('sg-text').value = '';
          if(note){ note.className='sg-note ok'; note.textContent='Thank you - your suggestion reached the organisers.'; }
          toast('Suggestion sent to the organisers.');
        } else {
          if(note){ note.className='sg-note bad'; note.textContent='Could not send. Please use the WhatsApp button.'; }
          toast('Could not send - please try the WhatsApp button.');
        }
      });
    });
  }

  /* clicks inside the book */
  book.addEventListener('click', function(ev){
    var goBtn = ev.target.closest('[data-go]');
    if(goBtn){ var t = +goBtn.getAttribute('data-go') - 1; go(t, t > current ? 1 : -1); return; }

    /* --- organiser mode --- */
    if(ev.target.closest('#org-on')){
      var code = window.prompt('Organiser passcode');
      if(code === null) return;
      if(code.trim() !== ORG_KEY){ toast('That passcode is not correct.'); return; }
      setOrg(true); mount(current); toast('Organiser mode on.');
      return;
    }
    if(ev.target.closest('#org-off')){ setOrg(false); mount(current); toast('Organiser mode off.'); return; }

    var oEdit = ev.target.closest('[data-edit-join],[data-edit-reg],[data-edit-baked]');
    if(oEdit && orgMode){
      var was = oEdit.getAttribute('data-name');
      var now2 = window.prompt('Correct the name', was);
      if(now2 === null) return;
      now2 = now2.trim();
      if(now2.length < 2){ toast('Please enter a name.'); return; }
      applyOrgChange(oEdit, 'rename', was, now2);
      return;
    }
    var oDel = ev.target.closest('[data-del-join],[data-del-reg],[data-del-baked]');
    if(oDel && orgMode){
      var nm2 = oDel.getAttribute('data-name');
      if(!window.confirm('Remove ' + nm2 + '?')) return;
      applyOrgChange(oDel, 'delete', nm2, '');
      return;
    }

    var stp = ev.target.closest('.stp');
    if(stp){
      var out = document.getElementById('reg-' + stp.getAttribute('data-for'));
      if(out){
        var min = parseInt(out.getAttribute('data-min'), 10) || 0;
        var v = (parseInt(out.getAttribute('data-v'), 10) || 0) + (+stp.getAttribute('data-step'));
        v = Math.max(min, Math.min(30, v));
        out.setAttribute('data-v', v);
        out.textContent = v;
      }
      return;
    }

    var pkBox = ev.target.closest('.picker input[type=checkbox]');
    if(pkBox && !pkBox.disabled){
      var wrap = pkBox.closest('.pick-wrap');
      var roleBox = wrap && wrap.querySelector('.pick-role');
      if(roleBox) roleBox.hidden = !pkBox.checked;
      return;
    }
    var rBtn = ev.target.closest('.rbtn');
    if(rBtn){
      var box = rBtn.closest('.pick-role');
      [].slice.call(box.querySelectorAll('.rbtn')).forEach(function(b){ b.classList.remove('on'); });
      rBtn.classList.add('on');
      return;
    }

    if(ev.target.closest('#pick-save')){
      var boxes = [].slice.call(book.querySelectorAll('.picker input[type=checkbox]:checked:not(:disabled)'));
      var msg = document.getElementById('pick-msg');
      if(!boxes.length){
        if(msg){ msg.className='sg-note bad'; msg.textContent='Tick at least one programme first.'; }
        return;
      }
      var noteEl = document.getElementById('pick-note');
      var note = noteEl ? noteEl.value.trim() : '';
      var btn = document.getElementById('pick-save');
      btn.disabled = true;
      if(msg){ msg.className='sg-note'; msg.textContent='Saving ' + boxes.length + '...'; }

      var left = boxes.length, failed = 0;
      boxes.forEach(function(box){
        var dayId = box.getAttribute('data-day'), actId = box.getAttribute('data-act');
        var day = S.days.filter(function(d){ return d.id===dayId; })[0];
        var act = day && day.activities.filter(function(x){ return x.id===actId; })[0];
        if(!act){ left--; return; }
        var label = day.weekday + ' ' + day.dnum + ' Oct';
        var wrap = box.closest('.pick-wrap');
        var chosen = wrap && wrap.querySelector('.rbtn.on');
        var role = chosen ? chosen.getAttribute('data-role') : defaultRole(act);
        var detail = role + (note ? ' - ' + note : '');
        if(!mine.some(function(e){ return e.day===dayId && e.act===actId; })){
          mine.push({day:dayId, act:actId, actName:act.name, dayLabel:label,
                     detail:detail, sent:false});
        }
        apiPost({action:'join', name:me.name, phone:me.phone, day:dayId, dayLabel:label,
                 act:actId, actName:act.name, detail:detail}, function(ok){
          if(ok){
            mine.forEach(function(e){ if(e.day===dayId && e.act===actId) e.sent = true; });
          } else { failed++; }
          if(--left === 0){
            saveMine();
            fetchLive(function(){
              mount(current);
              var m2 = document.getElementById('pick-msg');
              if(m2){
                if(failed){ m2.className='sg-note bad';
                  m2.textContent = failed + ' could not be saved - please try again.'; }
                else { m2.className='sg-note ok';
                  m2.textContent = 'Saved. You are on the list for ' + boxes.length + '.'; }
              }
              toast(failed ? 'Some choices did not save.' : 'Saved to the shared list.');
            });
          }
        });
      });
      return;
    }

    var regSave = ev.target.closest('#reg-save');
    if(regSave){
      var nEl = document.getElementById('reg-name'), pEl = document.getElementById('reg-phone');
      var nm = nEl.value.trim(), ph = pEl.value.trim();
      if(nm.length < 2){ nEl.focus(); toast('Please enter your name.'); return; }
      if(digits(ph).length < 7){ pEl.focus(); toast('Please enter a valid phone number.'); return; }
      var ad = Math.max(1, Math.min(30, stepValue('adults') || 1));
      var ch = Math.max(0, Math.min(30, stepValue('children')));
      me.name = nm; me.phone = ph; me.adults = ad; me.children = ch;
      saveMe(); editing = false; mount(current);
      toast('Registered as ' + nm + ', ' + partyText() + '.');
      apiPost({action:'register', name:nm, phone:ph, adults:ad, children:ch,
               total:ad + ch}, function(ok){
        if(ok) fetchLive(function(){ if(current === REG_PAGE - 1) mount(current); });
      });
      return;
    }
    if(ev.target.closest('#reg-edit')){ editing = true; mount(current); return; }

    var add = ev.target.closest('[data-add]');
    if(add){
      if(!registered()){ toast('Please register with your name and phone first.'); return; }
      var dayId = add.getAttribute('data-day'), actId = add.getAttribute('data-act');
      var input = book.querySelector('.join input[data-day="'+dayId+'"][data-act="'+actId+'"]');
      var val = input ? input.value.trim() : '';
      var day = S.days.filter(function(d){ return d.id===dayId; })[0];
      var act = day && day.activities.filter(function(a){ return a.id===actId; })[0];
      if(!act) return;
      if(mine.some(function(e){ return e.day===dayId && e.act===actId && (e.detail||'')===val; })){
        toast('You have already joined this programme.'); return;
      }
      mine.push({day:dayId, act:actId, actName:act.name,
                 dayLabel:day.weekday + ' ' + day.dnum + ' Oct', detail:val, sent:false});
      saveMine();
      var pg0 = activePage();
      var keep = pg0 ? pg0.querySelector('.sheet').scrollTop : 0;
      mount(current);
      var pg1 = activePage();
      if(pg1) pg1.querySelector('.sheet').scrollTop = keep;
      toast(ENDPOINT ? 'Joined. Adding you to the shared list...'
                     : 'Joined. Open My entries to send it to the organisers.');
      apiPost({action:'join', name:me.name, phone:me.phone,
               day:dayId, dayLabel:day.weekday + ' ' + day.dnum + ' Oct',
               act:actId, actName:act.name, detail:val}, function(ok){
        if(!ok) return;
        mine.forEach(function(en){
          if(en.day===dayId && en.act===actId && (en.detail||'')===val) en.sent = true;
        });
        saveMine();
        fetchLive(function(){
          var p = activePage();
          var sc = p ? p.querySelector('.sheet').scrollTop : 0;
          mount(current);
          var p2 = activePage();
          if(p2) p2.querySelector('.sheet').scrollTop = sc;
          toast('You are on the shared list.');
        });
      });
      return;
    }

    var del = ev.target.closest('[data-del]');
    if(del){
      var i = parseInt(del.getAttribute('data-del'), 10);
      if(isNaN(i)) return;
      mine.splice(i,1); saveMine(); mount(current); toast('Entry removed.');
    }
  });

    if(!tracking) return;

    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;

  try{
    var mf={name:'Sharadiya Durga Puja 2026 (Laos)', short_name:'Durga Puja',
      description:'Cultural and evening activities programme',
      start_url:'.', display:'standalone', orientation:'portrait',
      background_color:'#3A1416', theme_color:'#3A1416',
      icons:[{src:ICON192,sizes:'192x192',type:'image/png'},
             {src:ICON512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    var ml=document.createElement('link'); ml.rel='manifest';
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
    document.head.appendChild(ml);
  }catch(e){}

  window.__pbInstall = function(){
    var card=document.getElementById('install');
    var txt=document.getElementById('install-txt');
    var img=document.getElementById('install-ico');
    if(!card||!txt) return;
    var standalone = window.navigator.standalone===true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var dismissed=false;
    try{ dismissed = localStorage.getItem('durgapuja2026-install')==='no'; }catch(e){}
    var touch = window.matchMedia && window.matchMedia('(hover: none)').matches;
    if(standalone||dismissed||!touch) return;
    if(img) img.src=ICON192;
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    txt.innerHTML='<b>Keep this book on your phone</b>' + (ios
      ? 'Tap Share, then <b style="display:inline">Add to Home Screen</b>.'
      : 'Open the browser menu, then <b style="display:inline">Add to Home screen</b>.');
    card.classList.add('show');
  };

  window.__pbMount = mount;
  mount(0);

  /* pull the shared list once at start, then keep it fresh while the book is open */
  if(ENDPOINT){
    fetchLive(function(){ mount(current); });
    setInterval(function(){
      if(document.hidden) return;
      fetchLive(function(){
        if(current === 1 || current === REG_PAGE - 1 ||
           PAGES[current].indexOf('day') === 0){
          var p = activePage();
          var sc = p ? p.querySelector('.sheet').scrollTop : 0;
          mount(current);
          var p2 = activePage();
          if(p2) p2.querySelector('.sheet').scrollTop = sc;
        }
      });
    }, 45000);
  }
})();
